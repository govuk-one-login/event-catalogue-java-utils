name: PR Quality Gate

# Enforces the required quality gates on every pull request targeting main:
#   1. Build without errors
#   2. Unit tests
#   3. Linting (Checkstyle)
#   4. Static analysis (SonarCloud) with the SonarCloud quality gate
#
# Pushes to main re-run the same analysis so the project's "main" branch
# baseline in SonarCloud stays up to date.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, test, lint and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # allow SonarCloud PR decoration
      packages: read       # read the event-catalogue-schema artifact from GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history gives SonarCloud accurate blame / new-code detection.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      # Gate 1-3: compile, unit tests and Checkstyle linting all run as part of
      # `./gradlew build` (the `check` task it depends on runs test + checkstyle).
      # Gate 4: `sonar` uploads analysis and, with sonar.qualitygate.wait=true,
      # blocks until the SonarCloud quality gate result is known so the job
      # fails if the gate is red.
      - name: Build, test, lint and analyze
        env:
          # Resolve the event-catalogue-schema artifact from GitHub Packages using
          # the automatic GITHUB_TOKEN (same pattern as other govuk-one-login Java
          # repos, e.g. authentication-api). This requires the event-catalogue
          # package to grant read access to this repo (see the package's
          # "Manage Actions access" settings) and the job's packages:read permission.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provided via repository/organization secrets for SonarCloud auth.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew build sonar
          -Dsonar.qualitygate.wait=true
          --no-configuration-cache
          --info
