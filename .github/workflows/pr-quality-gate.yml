name: PR Quality Gate

# Enforces the required quality gates on every pull request targeting main:
#   1. Build without errors
#   2. Unit tests
#   3. Linting (Checkstyle)
#   4. Static analysis (SonarCloud) with the SonarCloud quality gate
#
# Pushes to main re-run the same analysis so the project's "main" branch
# baseline in SonarCloud stays up to date.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, test, lint and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # allow SonarCloud PR decoration
      packages: read       # read the event-catalogue-schema artifact from GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history gives SonarCloud accurate blame / new-code detection.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      # Gate 1-3: compile, unit tests and Checkstyle linting all run as part of
      # `./gradlew build` (the `check` task it depends on runs test + checkstyle).
      # Gate 4: `sonar` uploads analysis and, with sonar.qualitygate.wait=true,
      # blocks until the SonarCloud quality gate result is known so the job
      # fails if the gate is red.
      # TEMP DIAGNOSTIC: determine why event-catalogue-schema fails to resolve.
      # Probes the GitHub Packages Maven registry directly and reports the HTTP
      # status, distinguishing "no/empty token" from "token present but no access"
      # (403/404) from "works" (200). Remove once resolution is confirmed working.
      - name: Diagnose GitHub Packages access
        env:
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GPR_TOKEN" ]; then
            echo "GPR_TOKEN is set (length ${#GPR_TOKEN}); using it."
            TOKEN="$GPR_TOKEN"
          else
            echo "GPR_TOKEN is NOT set; falling back to GITHUB_TOKEN."
            TOKEN="$FALLBACK_TOKEN"
          fi
          URL="https://maven.pkg.github.com/govuk-one-login/event-catalogue/uk/gov/di/model/event-catalogue-schema/1.0.0/event-catalogue-schema-1.0.0.pom"
          echo "Probing: $URL"
          CODE=$(curl -sS -o /tmp/probe.out -w "%{http_code}" -u "x:$TOKEN" "$URL" || echo "curl-failed")
          echo "HTTP status: $CODE"
          echo "---- response body (first 20 lines) ----"
          head -20 /tmp/probe.out || true
          echo "-----------------------------------------"
          echo "Interpretation: 200=OK, 401=bad/empty token, 403/404=token lacks access to this package."

      - name: Build, test, lint and analyze
        env:
          # Resolve the event-catalogue-schema artifact from GitHub Packages.
          # The schema package lives in the separate govuk-one-login/event-catalogue
          # repo, which the automatic GITHUB_TOKEN usually cannot read across repos.
          # Provide a PAT/org token with 'read:packages' as the GPR_TOKEN secret;
          # falls back to GITHUB_TOKEN when the package is accessible to this repo.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          # Provided via repository/organization secrets for SonarCloud auth.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew build sonar
          -Dsonar.qualitygate.wait=true
          --no-configuration-cache
          --info
