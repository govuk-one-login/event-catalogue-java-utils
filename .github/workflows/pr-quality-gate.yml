name: PR check

on:
  pull_request:
    branches: [ 'main' ]

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-commit checks
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@3b0015c58dd0e19e1572fda59dda4184df387d1e
        with:
          all-files: true

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # read the event-catalogue-schema artifact from GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK setup
        uses: actions/setup-java@v5
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'corretto'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Checks and tests
        env:
          # Resolve the private event-catalogue-schema artifact from GitHub Packages.
          # The default GITHUB_TOKEN is scoped to this repo only and cannot read a
          # package owned by the event-catalogue repo, so a dedicated PAT secret with
          # read:packages (GH_PACKAGES_TOKEN) is used, mirroring the pattern in
          # govuk-one-login-frontend. Falls back to GITHUB_TOKEN if the secret is unset.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew spotlessCheck unitTestCodeCoverageReport

      - name: Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/jacoco/
          retention-days: 3
