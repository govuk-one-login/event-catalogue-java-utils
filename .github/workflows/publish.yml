name: Publish

# Publishing is triggered by publishing a GitHub Release. The release tag is the
# version: tag v1.2.3 -> publishes 1.2.3 to GitHub Packages. To cut a release,
# create a GitHub Release with a vX.Y.Z tag (Releases -> Draft a new release).
# Normal pushes to main never publish; a release is a deliberate action.

on:
  release:
    types: [ published ]
  # Manual re-run against an existing tag if a release publish needs repeating.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from tag
        id: version
        env:
          REF: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Strip any leading "v" (v1.2.3 -> 1.2.3).
          VERSION="${REF#v}"
          if [ -z "${VERSION}" ]; then
            echo "No release tag available." >&2
            exit 1
          fi
          echo "Publishing version ${VERSION} (from tag ${REF})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.ref }}

      - name: JDK setup
        uses: actions/setup-java@v5
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'corretto'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build and test
        env:
          # Building resolves the private event-catalogue-schema artifact (owned by
          # the event-catalogue repo), which the default GITHUB_TOKEN cannot read,
          # so prefer the GH_PACKAGES_TOKEN PAT and fall back to GITHUB_TOKEN.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :lib:build -Pversion="${{ steps.version.outputs.version }}"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :lib:publish -Pversion="${{ steps.version.outputs.version }}"
