name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Build, test and analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can assign issues to the right authors
          # and correctly compute "new code".
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, coverage and SonarCloud analysis
        env:
          # Resolve the event-catalogue-schema artifact from GitHub Packages
          # (see lib/build.gradle). GITHUB_TOKEN is provided automatically.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SonarCloud auth token (add this as a repository/organisation secret).
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew test jacocoTestReport sonar
          --no-configuration-cache
