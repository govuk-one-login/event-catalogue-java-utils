
plugins {
    id 'java-library'
    // Produce coverage reports for SonarCloud.
    id 'jacoco'
    // Auto-format Java sources.
    id 'com.diffplug.spotless' version '8.10.4'

    id 'maven-publish'
}

group = 'uk.gov.di.model'
version = project.findProperty('version') ?: '0.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api libs.commons.math3

    implementation libs.guava
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.93
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.93
            }
        }
    }
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat().aosp().formatJavadoc(true)
        importOrder '', 'javax', 'java', '\\#'
        removeUnusedImports()
        forbidWildcardImports()
        formatAnnotations()
        endWithNewline()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'event-catalogue-java-utils'
            version = project.version

            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/govuk-one-login/event-catalogue-java-utils')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}
