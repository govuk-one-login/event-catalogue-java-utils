
plugins {
    id 'java-library'
    // Produce coverage reports for SonarCloud.
    id 'jacoco'
    // Auto-format Java sources.
    id 'com.diffplug.spotless' version '8.10.4'

    id 'maven-publish'
}

group = 'uk.gov.di.model'
version = project.findProperty('version') ?: '0.0.0-SNAPSHOT'

repositories {
    // Resolve a locally published copy of the schema artifact if present.
    mavenLocal()

    // Use Maven Central for resolving third-party dependencies.
    mavenCentral()

    // The event-catalogue schemas are published as a Maven artifact to GitHub Packages.
    // Credentials are read from Gradle properties (gpr.user / gpr.key) or the
    // GITHUB_ACTOR / GITHUB_TOKEN environment variables used in CI.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/govuk-one-login/event-catalogue')
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    // Event schemas are PROVIDED BY THE CONSUMING APPLICATION at runtime, not bundled
    // by this library (analogous to the optional peerDependency in the TypeScript
    // @govuk-one-login/event-catalogue-utils package). This lets consumers control the
    // schema version and avoids this library re-releasing on every catalogue bump.
    testImplementation 'uk.gov.di.model:event-catalogue-schema:51.1.1'

    // JSON Schema draft 2019-09 validator + Jackson.
    implementation 'com.networknt:json-schema-validator:1.5.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    // Logging facade used to log validation outcomes.
    implementation 'org.slf4j:slf4j-api:2.0.20'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Provide a logging binding so slf4j output is visible during tests.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.93
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.93
            }
        }
    }
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat().aosp().formatJavadoc(true)
        importOrder '', 'javax', 'java', '\\#'
        removeUnusedImports()
        forbidWildcardImports()
        formatAnnotations()
        endWithNewline()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'event-catalogue-java-utils'
            version = project.version

            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/govuk-one-login/event-catalogue-java-utils')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}
