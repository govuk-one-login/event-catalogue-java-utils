/*
 * event-catalogue-java-utils
 *
 * Java validator for GOV.UK One Login events prior to sending to TxMA.
 */

plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    // Resolve the event-catalogue-schema artifact from a locally published copy
    // (./gradlew :schema-artefacts:publishToMavenLocal in the event-catalogue repo).
    mavenLocal()

    // Use Maven Central for resolving third-party dependencies.
    mavenCentral()

    // The event-catalogue schemas are published as a Maven artifact to GitHub Packages.
    // Credentials are read from Gradle properties (gpr.user / gpr.key) or the
    // GITHUB_ACTOR / GITHUB_TOKEN environment variables used in CI.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/govuk-one-login/event-catalogue')
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    // Event schemas are PROVIDED BY THE CONSUMING APPLICATION at runtime, not bundled
    // by this library (analogous to the optional peerDependency in the TypeScript
    // @govuk-one-login/event-catalogue-utils package). This lets consumers control the
    // schema version and avoids this library re-releasing on every catalogue bump.
    //
    
    testImplementation 'uk.gov.di.model:event-catalogue-schema:1.0.0'

    // JSON Schema draft 2019-09 validator + Jackson.
    implementation 'com.networknt:json-schema-validator:1.5.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Logging facade used to log validation outcomes.
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Provide a logging binding so slf4j output is visible during tests.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

