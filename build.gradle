// Root build configuration.
//
// The SonarQube/SonarCloud plugin must be applied to the root project; it then
// analyses all subprojects (currently just :lib). Coverage is produced by the
// JaCoCo plugin in each subproject and picked up automatically by Sonar.

plugins {
    id 'org.sonarqube' version '7.2.2.6593'
}

sonar {
    properties {
        property 'sonar.projectKey', 'govuk-one-login_event-catalogue-java-utils'
        property 'sonar.organization', 'govuk-one-login'
        property 'sonar.host.url', 'https://sonarcloud.io'
    }
}
